version: '3.8'

services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: vasudha_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vasudhaethnic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vasudhaethnic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Full-Stack Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vasudha_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/vasudhaethnic
      - SECRET_KEY=vasudha_luxury_ethnic_secret_key_2026_super_secure_jwt_token_seed
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # React Vite Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vasudha_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
